# Config for the tiny synthetic valley (generated by make_synthetic_valley.py).
# Elevations are metres; working CRS is EPSG:32610 (metres).

study_name: synthetic

crs:
  target: EPSG:32610

units:
  vertical: m

paths:
  dem: dem.tif
  centerline: centerline.shp
  channel_polygon: null
  centerline_points: null
  clip_boundary: null
  levee: null
  output_dir: outputs

extract:
  spacing: 200
  cross_half_length: 80
  max_half_length: 250
  sample_step: 10
  valley_wall_dz: 30
  valley_wall_persist: 20
  valley_wall_skip_channel: 60
  valley_wall_keep: 10
  max_elev_above_channel: 50
  channel_elev_window: 20
  backwater_length: 400
  centerline_smooth_window: 80
  centerline_smooth_sample: 10
  flow_tangent_half_delta: 40
  slope_smooth_window: 800
  slope_sample_step: 10
  thalweg_half_width: 40
  slope_min: 1.0e-5

lambda_calc:
  auto_minmax: false

labeler:
  show_satellite: false
  show_dem: true
  skip_existing: true
