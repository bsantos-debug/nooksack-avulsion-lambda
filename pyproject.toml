[tool.poetry]
name = "avulsionprecursors"
version = "0.2.0"
description = "Config-driven DEM workflow for avulsion potential (Λ), adapted from Jake Gearon's avulsionprecursors (https://github.com/jameshgrn/avulsionprecursors/tree/first) and rulesofriveravulsion routing walk (https://github.com/jameshgrn/rulesofriveravulsion)"
authors = ["bsantos-debug"]
readme = "README.md"
packages = [{include = "avulsionprecursors"}]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.0.0"
geopandas = "^0.14.0"
numpy = "^1.24.0"
scipy = "^1.0.0"
matplotlib = "^3.0.0"
rasterio = "^1.4.3"
pyproj = "^3.6.0"
pyyaml = "^6.0"
shapely = "^2.0.0"
pyqt5 = "^5.15.11"
cartopy = "^0.24.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"
isort = "^5.0.0"

[tool.poetry.scripts]
avulsion-process = "avulsionprecursors.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
